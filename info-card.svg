    </g>
    <g class="row" style="animation-delay: 0.7999999999999999s">
        <text class="text" x="20" y="232" fill="#f0883e" font-weight="bold">Highlights</text>
        <text class="text" x="120" y="232">: Shipped 10+ projects, open-source contributor</text>
